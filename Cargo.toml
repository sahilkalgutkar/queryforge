[workspace]
resolver = "2"
members = [
    "crates/qf-common",
    "crates/qf-storage",
    "crates/qf-sql",
    "crates/qf-plan",
    "crates/qf-exec",
    "crates/qf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Sahil Kalgutkar"]
repository = "https://github.com/sahilkalgutkar/queryforge"

[workspace.dependencies]
qf-common = { path = "crates/qf-common" }
qf-storage = { path = "crates/qf-storage" }
qf-sql = { path = "crates/qf-sql" }
qf-plan = { path = "crates/qf-plan" }
qf-exec = { path = "crates/qf-exec" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
